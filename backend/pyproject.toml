[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hiring-backend"
version = "1.0.0"
description = "Multi-Tenant AI Hiring Platform Backend Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "email-validator>=2.1.0",
    "python-slugify>=8.0.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "google-cloud-storage>=2.14.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.4.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-firestore>=2.29.0",
    "firebase-admin>=7.5.0",
    "ruff>=0.3.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "RUF"]
ignore = [
    "E501",   # Line length handled by code formatting
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
    "B017",   # Blind pytest.raises(Exception)
    "BLE001", # Blind exception catching (standard in top-level crash guards)
    "TRY003", # Exception message formatting
    "TRY201", # Re-raising exceptions
    "RUF059", # Unpacked variable unused
    "RUF001", # Ambiguous characters in test data
    "RUF006", # Async task references
    "RUF012", # Mutable class attributes
    "UP042",  # Class inherits from both str and enum.Enum (required for SQLAlchemy enum mapping)
    "UP046",  # Generic class uses Generic subclass (compatible with standard TypeVar)
    "W291",   # Trailing whitespace
    "W293",   # Blank line whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
