name: CD Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci-quality-gate:
    name: Run CI Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hiring_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Backend Quality Check
        env:
          APP_ENV: testing
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hiring_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_bytes_long_1234567890
          JWT_ALGORITHM: HS256
          ENCRYPTION_KEY: test_encryption_key_32_bytes_long!!
          GEMINI_API_KEY: placeholder_test_key
          USE_GCP_SECRET_MANAGER: false
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio
          ruff check .
          alembic upgrade head
          pytest -v

      - name: Frontend Quality Check
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  container-build:
    name: Build & Push Production Containers
    needs: ci-quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        run: |
          echo "Logging into container registry..."

      - name: Build Backend Image
        run: |
          docker build -t ai-hiring-backend:${{ github.sha }} backend/

      - name: Build Frontend Image
        run: |
          docker build -t ai-hiring-frontend:${{ github.sha }} frontend/

  deploy-staging:
    name: Deploy to Staging Environment
    needs: container-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Staging Application & Workers
        run: |
          echo "Executing staging database migrations and container deployments..."

  deploy-production:
    name: Deploy to Production Environment (Approval Gate)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Production Infrastructure & Application
        run: |
          echo "Deploying production containers and verifying health probes..."
