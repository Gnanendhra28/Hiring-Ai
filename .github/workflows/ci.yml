name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Quality Gate (Python 3.13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hiring_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hiring_db
          APP_ENV: testing
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          APP_ENV: testing
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hiring_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_bytes_long_1234567890
          JWT_ALGORITHM: HS256
          ENCRYPTION_KEY: test_encryption_key_32_bytes_long!!
          GEMINI_API_KEY: placeholder_test_key
          USE_GCP_SECRET_MANAGER: false
        run: |
          cd backend
          pytest -v

  frontend-test:
    name: Frontend Quality Gate (Next.js 14 / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Production Build
        run: |
          cd frontend
          npm run build
