steps:
  # 1. Build backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-api:$BUILD_ID'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-api:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-api'

  # 3. Deploy backend service (ai-interview-api)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-interview-api'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-api:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=hiring-ai-507307:asia-south1:hiring-ai-pg'
      - '--labels=dev-tutorial=cloud-run-ai-challenge'
      - '--set-env-vars=APP_ENV=production,FIRESTORE_PROJECT_ID=hiring-ai-4ae76,FIREBASE_PROJECT_ID=hiring-ai-4ae76,READINESS_CHECK_DB=false,READINESS_CHECK_REDIS=false'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest'

  # 4. Build frontend container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-frontend:$BUILD_ID'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://ai-interview-api-30597175496.asia-south1.run.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=hiring-ai-4ae76'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=hiring-ai-4ae76.firebaseapp.com'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=hiring-ai-4ae76.firebasestorage.app'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  # 5. Push frontend container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-frontend'

  # 6. Deploy frontend service (ai-interview-frontend)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-interview-frontend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-frontend:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--labels=dev-tutorial=cloud-run-ai-challenge'
      - '--set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_API_URL=https://ai-interview-api-30597175496.asia-south1.run.app,NEXT_PUBLIC_FIREBASE_PROJECT_ID=hiring-ai-4ae76,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=hiring-ai-4ae76.firebaseapp.com,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=hiring-ai-4ae76.firebasestorage.app'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-api:latest'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ai-interview-frontend:latest'
